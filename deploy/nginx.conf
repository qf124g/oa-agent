# 企业协同办公平台 nginx 配置
# 部署路径约定：项目放在 /opt/oa-platform，前端构建产物为 /opt/oa-platform/web/dist
# 将本文件放入 /etc/nginx/conf.d/oa.conf 后执行 nginx -t && systemctl reload nginx

server {
    listen 80;
    # 域名购买并解析后替换为真实域名
    server_name your-domain.com;

    root /opt/oa-platform/web/dist;
    index index.html;

    # 前端静态资源 + SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # agent-server：智能助手对话（SSE 流式，必须关闭缓冲）
    location = /api/chat {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        # 流式对话可能持续较久，放宽读超时
        proxy_read_timeout 300s;
    }

    # agent-server：写操作确认续传（同样是 SSE）
    location = /api/chat/confirm {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # 其余 /api/* 全部转发到业务后端
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
